name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: environment
        run: terraform init

      - name: Terraform Plan
        working-directory: environment
        run: terraform plan -out="${{ github.workspace }}/.github/script/tfplan"

      - name: Terraform Show JSON
        working-directory: environment
        run: terraform show -json "${{ github.workspace }}/.github/script/tfplan" > "${{ github.workspace }}/.github/script/terraform_plan_summary.json"

      - name: Run Summary Script
        working-directory: .github/script
        run: |
          chmod +x summary.sh
          ./summary.sh
