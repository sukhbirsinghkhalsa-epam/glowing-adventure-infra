name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}



jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ env.ARM_CLIENT_ID }}",
              "clientSecret": "${{ env.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ env.ARM_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      - name: Terraform Init
        working-directory: environment
        run: terraform init

      - name: Terraform Plan
        working-directory: environment
        run: terraform plan -out="${{ github.workspace }}/.github/script/tfplan"
        
      - name: Terraform Show JSON
        working-directory: environment
        run: |
          terraform show -json "${{ github.workspace }}/.github/script/tfplan" \
            > "${{ github.workspace }}/.github/script/terraform_plan_summary.json"

          sed -i 's/%0A$//' "${{ github.workspace }}/.github/script/terraform_plan_summary.json"

      - name: Display Json
        working-directory: .github/script
        run: |
          cat terraform_plan_summary.json
          
      - name: Give Required Permission & convert to bash based script
        working-directory: .github/script
        run: |
          chmod +x summary.sh
          sed -i 's/\r$//' summary.sh

      - name: Debug JSON
        working-directory: .github/script
        run: |
          echo "=== SIZE ==="
          wc -c terraform_plan_summary.json
      
          echo "=== FIRST 200 CHARACTERS ==="
          head -c 200 terraform_plan_summary.json
          echo
      
          echo "=== FIRST 100 BYTES ==="
          head -c 100 terraform_plan_summary.json | xxd
      
          echo "=== LAST 100 BYTES ==="
          tail -c 100 terraform_plan_summary.json | xxd
      
          echo "=== JSON VALIDATION ==="
          jq empty terraform_plan_summary.json
      
      - name: Validate JSON
        working-directory: .github/script
        run: |
          wc -c terraform_plan_summary.json
          tail -c 500 terraform_plan_summary.json
          jq empty terraform_plan_summary.json

      - name: Run Summary Script
        working-directory: .github/script
        run: |
          ./summary.sh
